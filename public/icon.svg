<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <rect width="512" height="512" rx="120" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="8"/>
  <g filter="url(#glow)" transform="translate(30, 20)">
    <!-- Paper plane / ship -->
    <path d="M140 250 L380 130 L270 380 L230 270 Z" fill="url(#brand)" fill-opacity="0.2" stroke="url(#brand)" stroke-width="20" stroke-linejoin="round"/>
    <path d="M380 130 L230 270" fill="none" stroke="url(#brand)" stroke-width="20" stroke-linecap="round"/>
    <path d="M230 270 L210 330 L245 295" fill="none" stroke="url(#brand)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Proof / checkmark inside or nearby -->
    <path d="M320 300 L350 330 L410 250" fill="none" stroke="#22c55e" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </g>
</svg>